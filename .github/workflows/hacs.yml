name: HACS

on:
  push:
  pull_request:
  public:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS repository validation (public repository)
    # HACS downloads manifests through public raw.githubusercontent.com URLs.
    # The public event below starts this workflow automatically when repository
    # visibility changes; private development runs keep this network check skipped.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate HACS integration
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-08-19
        with:
          category: integration
          comment: false

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master 2026-08-19
