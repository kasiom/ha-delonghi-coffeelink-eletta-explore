name: Validate

on:
  push:
  pull_request:
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests tests_ha
      - name: Run Ruff
        run: python -m ruff check custom_components tests tests_ha
      - name: Check Ruff formatting
        run: python -m ruff format --check custom_components tests tests_ha
      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=custom_components/ha_delonghi_coffeelink_eletta_explore
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  home-assistant-runtime:
    name: Home Assistant 2026.8.2 runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements_ha_test.txt
      - name: Install Home Assistant test runtime
        run: python -m pip install --requirement requirements_ha_test.txt
      - name: Run strict type checking
        run: python -m mypy custom_components/ha_delonghi_coffeelink_eletta_explore
      - name: Test against real Home Assistant interfaces
        run: python -m pytest -q -c pytest_ha.ini
