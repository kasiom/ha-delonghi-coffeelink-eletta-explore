name: Feature request
description: Suggest a safe, model-specific improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: model
    attributes:
      label: Coffee maker model and region
      placeholder: Eletta Explore ECAM450.65.G, EU
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Include risks involving hot liquids, accessories, cloud sessions or model differences.
    validations:
      required: true
